<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt oss</title>
    <style>
      ._uia_chat_collapse {
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: 0fr;
        opacity: 0;
        visibility: hidden;
        transition:
          grid-template-rows 0.4s ease,
          opacity 0.4s ease,
          visibility 0s linear 0.4s;
      }

      ._uia_chat_collapse._uia_open {
        grid-template-rows: 1fr;
        opacity: 1;
        visibility: visible;
        transition:
          grid-template-rows 0.4s ease,
          opacity 0.4s ease,
          visibility 0s;
      }

      .chat {
        display: flex;
        flex-direction: column;
        gap: 12px;
        padding: 0 16px;
        background: #f8eddd;
        min-height: 0;
        transition: padding 0.4s ease;
      }

      ._uia_open .chat {
        padding: 16px;
      }

      @media (prefers-reduced-motion: reduce) {
        ._uia_chat_collapse,
        .chat {
          transition: none;
        }
      }

      .bubble {
        position: relative;
        max-width: 70%;
        padding: 8px 12px;
        border-radius: 8px;
        line-height: 1.4;
        box-shadow: 0 1px 1px rgba(0, 0, 0, 0.13);
      }

      /* Felles for pilen */
      .bubble::before {
        content: "";
        position: absolute;
        top: 0;
        width: 0;
        height: 0;
        border-style: solid;
      }

      /* Venstre: mottatt melding */
      .bubble.left {
        align-self: flex-start;
        background: #c8102e;
        color: white;
        border-top-left-radius: 0; /* skarpt hjørne der pilen starter */
      }

      .bubble.left::before {
        left: -8px;
        border-width: 0 8px 8px 0;
        border-color: transparent #c8102e transparent transparent;
      }

      /* Høyre: sendt melding */
      .bubble.right {
        align-self: flex-end;
        background: white;
        border-top-right-radius: 0;
        width: 100%;
      }

      .bubble.right::before {
        right: -8px;
        border-width: 0 0 8px 8px;
        border-color: transparent transparent transparent white;
      }

      ._uia_email_box,
      ._uia_message_box {
        display: flex;
        flex-direction: column;
      }

      #_uia_email {
        border: none;
        border-bottom: 1px solid lightgray;
        border-radius: 0;
        margin-top: 0.5rem;
        margin-bottom: 2rem;
      }

      #_uia_message {
        border: none;
        margin-top: 0.5rem;
        font-family: inherit;
        font-size: inherit;
        resize: none;
        width: 100%;
        box-sizing: border-box;
        min-height: 10lh;
      }

      ._uia_send_box {
        margin-top: 1rem;
        display: flex;
        justify-content: flex-end;
      }

      ._uia_hidden {
        display: none;
      }

      #_uia_contact_us {
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <button
      class="button-loud"
      id="_uia_contact_us"
      aria-expanded="false"
      aria-controls="_uia_chat"
    >
      Kontakt oss
    </button>
    <div class="_uia_chat_collapse" id="_uia_chat">
      <div class="chat">
        <div class="bubble left">
          Hei! Skriv kort om hva du trenger hjelp med, så kommer vil tilbake til
          deg så fort som mulig!
        </div>
        <div class="bubble right">
          <div class="_uia_email_box">
            <label for="_uia_email"><strong>Din e-post:</strong></label>
            <input type="email" name="email" id="_uia_email" />
          </div>
          <div class="_uia_message_box">
            <label for="_uia_message"
              ><strong>Din melding til oss:</strong></label
            >
            <textarea
              name="message"
              id="_uia_message"
            ></textarea>
          </div>
          <div class="_uia_send_box">
            <button class="button-loud" id="_uia_send_btn">Send melding</button>
          </div>
        </div>
      </div>
    </div>

    <script>
      const contact = document.getElementById("_uia_contact_us");
      const chat = document.getElementById("_uia_chat");
      const email = document.getElementById("_uia_email");
      const message = document.getElementById("_uia_message");
      const sendBtn = document.getElementById("_uia_send_btn");

      contact.addEventListener("click", () => {
        chat.classList.toggle("_uia_open");
        contact.setAttribute("aria-expanded", open);
      });

      sendBtn.addEventListener("click", async () => {
        if (email.value === "" || message.value === "") {
          alert("Du må oppgi en e-post og en melding!");
          return;
        }

        try {
          const res = await fetch("https://home.uia.no/esper18/api/msg.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              email: email.value,
              message: message.value,
            }),
          });

          console.log(res);
          if (res.status === 200) {
            const data = await res.json();
            console.log(data);
            alert("Meldingen er sendt!");
          }
        } catch (err) {
          alert("Noe gikk galt med sending av meldingen.");
          console.error(err);
        }
        console.log(`${email.value} sier: ${message.value}`);
      });
    </script>
  </body>
</html>
